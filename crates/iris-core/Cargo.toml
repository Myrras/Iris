[package]
name = "iris-core"
description = "UI-agnostic core for Iris: domain logic and state, behind a single entry point. Zero Tauri dependency."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Broadcast channel for the core event bus (`events.rs`); `net`/`fs`/
# `io-util` for the SSH transport and the local filesystem.
tokio = { workspace = true, features = ["net", "fs", "io-util"] }
tracing.workspace = true
uuid.workspace = true
# SSH transport. Only `ssh/` and `fs/sftp.rs` touch it: russh's API churns
# between minors, so the minor is pinned and the surface kept small. `ring` as
# the crypto backend (no cmake/nasm needed on Windows, unlike aws-lc-rs).
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
# Wipes `Secret` contents on drop.
zeroize = "1"
# `~/.ssh/config` parsing (Host aliases, HostName/User/Port/IdentityFile/
# ProxyJump). Only `ssh_config.rs` touches it.
ssh2-config = "0.8.2"
# OS keychain for remembered passwords / passphrases (`secrets.rs`).
# macOS Keychain and Windows Credential Manager here; Linux below.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
trash = "5.2.9"
base64 = "0.22"
# `CancellationToken` for cancelling transfer jobs and batches.
tokio-util = "0.7"
# Watching the local copies of files opened for editing (`edit/`): the
# debouncer coalesces an editor's burst of writes/renames into one change.
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"

# Linux: the Secret Service (GNOME Keyring/KWallet) over D-Bus. Building needs
# the libdbus headers (`libdbus-1-dev` / `dbus-devel`).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
# Host/client key generation for the in-process SFTP test server.
rand = "0.10"
# The in-process ssh-agent in the tests listens on a Unix socket.
tokio-stream = { version = "0.1", features = ["net"] }
# Dockerized OpenSSH servers for `tests/ssh_integration.rs` (ignored by
# default; `just test-integration`).
testcontainers = "0.27"

