       the Podium and Selene marks use (same opacity steps). Iris, the
       messenger of the gods, travelled on the rainbow; the arch also reads
       as a passage between two sides. LogoMark.tsx draws these paths in
       currentColor; iris.svg puts them on the app-icon tile. -->
