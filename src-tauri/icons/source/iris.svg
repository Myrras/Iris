<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Iris app icon: the LogoMark rainbow (iris-mark.svg) on a dark tile
       sized to the macOS icon grid (824 px body, 100 px transparent margin,
       ~22.5% corner radius), as Selene's icon. Source of truth for the
       generated PNG/ICNS/ICO icons: `just icons` renders it to
       iris-1024.png and runs `pnpm tauri icon` on that. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c222b"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4493f8"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#tile)"/>
  <g fill="url(#accent)" filter="url(#shadow)" transform="translate(192,204.8) scale(6.4)">
    <path d="M6 76V64A44 44 0 0 1 94 64V76H84V64A34 34 0 0 0 16 64V76Z" opacity="0.45"/>
    <path d="M20 76V64A30 30 0 0 1 80 64V76H70V64A20 20 0 0 0 30 64V76Z" opacity="0.72"/>
    <path d="M34 76V64A16 16 0 0 1 66 64V76Z"/>
  </g>
</svg>
