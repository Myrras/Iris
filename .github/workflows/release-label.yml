# Every PR must carry exactly one release label (patch, minor or major): the
# release job in ci.yml reads it to pick the version bump on merge.
# A separate workflow on purpose: (un)labeling a PR re-runs only this check,
# not the heavy CI.
name: Release label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, edited]

permissions: {}

jobs:
  release-label:
    name: Release label
    runs-on: ubuntu-latest
    env:
      LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - name: Require exactly one of patch, minor, major
        run: |
          count=0
          for label in patch minor major; do
            if [[ ",$LABELS," == *",$label,"* ]]; then count=$((count + 1)); fi
          done
          if [[ $count -ne 1 ]]; then
            echo "::error::Set exactly one release label on this PR: patch, minor or major (found $count)."
            exit 1
          fi
